name: Update low-latency-vulkan-layer

# Thin wrapper: all logic lives in .github/workflows/module-update.yml. The
# updater opens a PR and cache-server's external build gates the merge, so this
# repo's main only advances after a green build.
on:
  schedule:
    # GitHub may delay or skip scheduled runs, and they only run on the default branch.
    - cron: "20 5 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  update:
    uses: ./.github/workflows/module-update.yml
    with:
      module: low-latency-vulkan-layer
      paths: modules/performance/low-latency-vulkan-layer
      command: nix-shell modules/performance/low-latency-vulkan-layer/update.sh
      version-file: modules/performance/low-latency-vulkan-layer/source.json
    secrets: inherit
