name: Update Savage Wind

# Thin wrapper: all logic lives in .github/workflows/module-update.yml. The
# updater opens a PR and cache-server's external build gates the merge.
on:
  schedule:
    # GitHub may delay or skip scheduled runs, and they only run on the default branch.
    - cron: "25 5 * * *"
  workflow_dispatch:
permissions: {}

jobs:
  update:
    uses: ./.github/workflows/module-update.yml
    with:
      module: savagewind
      paths: modules/tools/nintendo/nx/botw/savagewind
      command: nix-shell modules/tools/nintendo/nx/botw/savagewind/update.sh
      version-file: modules/tools/nintendo/nx/botw/savagewind/source.json
    secrets: inherit
